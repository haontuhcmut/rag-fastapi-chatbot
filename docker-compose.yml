services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Expose internally; access via Nginx proxy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=1
      - PYTHONUNBUFFERED=1
      # Use container DNS names for internal services
      - DATABASE_URL_ASYNCPG_DRIVER=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DATABASE_URL_PSYCOPG_DRIVER=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PSYCOPG_CONNECT=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - MINIO_URL=minio:9000
      - REDIS_URL=redis://redis:6379
      - BROKER_URL=redis://redis:6379/0
      - BACKEND_URL=redis://redis:6379/1
    volumes:
      - ./backend:/app
    networks:
      - app_network
    depends_on:
      - db
      - redis
      - minio
      - ollama

    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  ollama:
    image: ollama/ollama:latest
    pull_policy: always
    ports:
      - "11435:11434"
    env_file:
      - .env
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - OLLAMA_HOST=${OLLAMA_HOST}
    volumes:
      - ./ollama_models:/root/.ollama
    networks:
      - app_network
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c", "\
      ollama serve & \
      sleep 10 && \
      ollama pull $LLM_MODEL && \
      wait" ]

  db:
    image: pgvector/pgvector:pg17-trixie
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Ho_Chi_Minh
    env_file:
      - ./.env
    ports:
      - "5433:5432"
    volumes:
      - psql_data:/var/lib/postgresql/data
    networks:
      - app_network

  minio:
    image: minio/minio:latest
    # Expose internally only to avoid port conflicts on hosts
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    # Expose internally only; Nginx/Backend access via network
    command:
      - redis-server
      - --appendonly
      - "yes"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Expose internally; Nginx will proxy to this
    ports:
      - "8080:80"
    networks:
      - app_network
    depends_on:
      - backend

volumes:
  psql_data:
  minio_data:

networks:
  app_network:
    driver: bridge
